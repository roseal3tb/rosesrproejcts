<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>مربع · ملاحظاتي</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin: 40px 0;
        }
        
        .note-card {
            width: 200px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
            border: 1px solid #eee;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        
        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #f3b33d;
        }
        
        .add-note-card {
            width: 200px;
            background: #eaf3fd;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #0a2647;
            transition: 0.3s;
            border: 2px dashed #0a2647;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .add-note-card:hover {
            background: #d0e2f5;
            transform: translateY(-5px);
        }
        
        .note-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .note-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0a2647;
            margin-bottom: 5px;
        }
        
        .note-date {
            color: #666;
            font-size: 0.8rem;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px auto 0 auto;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease;
            display: inline-block;
            text-decoration: none;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-3px);
        }
        
        .btn-secondary {
            background: #f3b33d;
            color: #000;
        }
        
        .btn-secondary:hover {
            background: #e0a02d;
            transform: translateY(-3px);
        }
        
        .checkbox-wrapper {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        
        .note-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .priority-high { background: #ffe5e5; }
        .priority-medium { background: #fff3e0; }
        .priority-low { background: #e8f5e9; }
    </style>
</head>
<body>

            <a href="MurabaiPage.html" style="text-decoration:none; color:gray;">مربعي</a> &gt;

            <a href="NewNotePage.html" class="add-note-card" style="text-decoration: none; width: 200px; background: #eaf3fd; border-radius: 20px; padding: 20px; text-align: center; color: #0a2647; transition: 0.3s; border: 2px dashed #0a2647; display: flex; flex-direction: column; align-items: center; justify-content: center;">

</div>

<script>
    // Load notes from localStorage
    function getNotes() {
        const notes = localStorage.getItem('studentNotes');
        return notes ? JSON.parse(notes) : [];
    }

    function saveNotes(notes) {
        localStorage.setItem('studentNotes', JSON.stringify(notes));
    }

    function getPriorityClass(priority) {
        if (priority === 1) return 'priority-high';
        if (priority === 2) return 'priority-medium';
        return 'priority-low';
    }

    function getPriorityText(priority) {
        if (priority === 1) return '🔴 عالية';
        if (priority === 2) return '🟡 متوسطة';
        return '🟢 منخفضة';
    }

    function renderNotes() {
        const notes = getNotes();
        const grid = document.getElementById('notesGrid');
        
        if (notes.length === 0) {
            grid.innerHTML = '<div style="text-align: center; width: 100%; color: #666;">لا توجد ملاحظات حالياً. أضف ملاحظة جديدة!</div>';
            return;
        }
        
        grid.innerHTML = '';
        notes.forEach(note => {
            const noteCard = document.createElement('div');
            noteCard.className = `note-card ${getPriorityClass(note.priority)}`;
            noteCard.setAttribute('data-id', note.id);
            noteCard.innerHTML = `
                <div class="checkbox-wrapper">
                    <input type="checkbox" class="note-checkbox" value="${note.id}">
                </div>
                <div class="note-icon">📝</div>
                <div class="note-title">${getPriorityText(note.priority)} - ${escapeHtml(note.title)}</div>
                <div class="note-date">${note.date}</div>
            `;
            grid.appendChild(noteCard);
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Delete selected notes
    document.getElementById('deleteSelectedBtn').addEventListener('click', function() {
        const checkboxes = document.querySelectorAll('.note-checkbox:checked');
        
        if (checkboxes.length === 0) {
            alert('الرجاء تحديد ملاحظة واحدة على الأقل للحذف');
            return;
        }
        
        const confirmDelete = confirm(`هل أنت متأكد من حذف ${checkboxes.length} ملاحظة؟`);
        
        if (confirmDelete) {
            const notes = getNotes();
            const idsToDelete = Array.from(checkboxes).map(cb => parseInt(cb.value));
            const remainingNotes = notes.filter(note => !idsToDelete.includes(note.id));
            saveNotes(remainingNotes);
            renderNotes();
        }
    });

    // Initial render
    renderNotes();
</script>

</body>
</html>
